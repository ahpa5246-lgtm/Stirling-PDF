services:
  - type: web
    name: pdf-tools-preview
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render-preview
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: SERVER_PORT
        value: "10000"
      - key: SERVER_ADDRESS
        value: "0.0.0.0"
      - key: DOCKER_ENABLE_SECURITY
        value: "false"
      - key: STIRLING_PDF_DESKTOP_UI
        value: "false"
      - key: SYSTEM_ENABLEANALYTICS
        value: "false"
      - key: SYSTEM_SHOWUPDATE
        value: "false"
